<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div.parent{
            width: 400px;
            height: 400px;
            border: 1px solid black;
            background-color: beige;
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            justify-content: center;
            align-items: center;
        }
        div.parent > span{
            position: absolute;
            left: 10px;
            right: 10px;
        }
        div.child{
            width: 300px;
            height: 300px;
            border: 1px solid black;
            background-color: rgb(160, 151, 151);
        }
    </style>
    <script>
        function onLoad(){
            //객체찾기
            const divParent = document.querySelector(".parent");
            const divChild = document.querySelector(".child");

            //이벤트등록 및 핸들러처리 (버블링방식)
            // divParent.addEventListener("click", ()=>{
            //     alert(`divParent`);
            // });
            // divChild.addEventListener("click", ()=>{
            //     alert(`divChild`);
            // });
            
            //이벤트등록 및 핸들러처리 (캡쳐링방식)
            divParent.addEventListener("click", ()=>{
                alert(`divParent`);
            });
            divChild.addEventListener("click", (event)=>{
                alert(`divChild`);
                event.stopPropagation();
            });
        }
    </script>
</head>
<body onload="onLoad();">
    <div class="parent">
        <span>부모영역</span>
        <div class="child">
            <span>자식영역</span>
        </div>
    </div>
</body>
</html>
