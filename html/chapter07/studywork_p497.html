<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            border: 1px solid black;
            width: 900px;
        }
        div{
            border: 1px solid black;
            padding: 10px;
            margin: 10px;
            text-align: center;
            display: inline-block;
        }
    </style>
</head>
<body>
    <h1>구구단</h1>
    <script>
        var i, j;
        for(i=1; i<=9; i++){
            document.write("<div>");
            document.write("<b>" + i + "단" + "</b>" +"<br><br>");
            for(j=1; j<=9; j++){
                document.write(i +"X" + j + "=" + i*j + "<br>");
            }
            document.write("</div>");
        }
    </script>
</body>
</html>
